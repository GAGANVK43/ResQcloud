spring:
  application:
    name: resqcloud-platform
  profiles:
    active: dev
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  
  # Incident Priority Scoring Configuration (Weightings & Thresholds)
  priority:
    weights:
      severity: 35.0
      affected-people: 25.0
      incident-type: 20.0
      time-sensitivity: 10.0
      resource-availability: 10.0
    thresholds:
      low-max: 30.0
      medium-max: 60.0
      high-max: 80.0
      critical-min: 81.0

  # Resource Matching Radius & Factor Configuration
  matching:
    max-search-radius-km: 50.0
    distance-weight: 0.4
    capability-weight: 0.35
    workload-weight: 0.25

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.resqcloud: DEBUG
    org.springframework.security: INFO
